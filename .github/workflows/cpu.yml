name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-cluster.txt
      - run: python scripts/prepare_model.py --model-dir .cache/processor --processor-only
      - run: python scripts/run_cpu_checks.py --model-dir .cache/processor
      - run: python -I -S -B experiments/wshy/sember-resolution-stage-20261025/verify_delivery.py
      - run: python -I -S -B -m unittest discover -s experiments/wshy/sember-resolution-stage-20261025/tests -v
      - run: git diff --check
